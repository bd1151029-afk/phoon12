<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>張國榮 Leslie | 個人主頁</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #FFEDD5 0%, #FCE7F3 50%, #E0F2FE 100%);
            color: #1E293B;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .card {
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 32px;
            padding: 2.25rem 1.75rem;
            text-align: center;
            border: 2px solid #FFFFFF;
            box-shadow: 0 20px 45px -15px rgba(249, 115, 22, 0.18),
                        0 10px 25px -10px rgba(14, 165, 233, 0.15);
        }

        /* 個人照片位置 */
        .photo-wrap {
            width: 136px;
            height: 136px;
            margin: 0 auto 1.1rem;
            padding: 5px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FF6B6B, #FFA94D, #38BDF8);
            box-shadow: 0 10px 24px -6px rgba(255, 107, 107, 0.45);
        }

        .photo-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
            background: #FFF7ED;
        }

        .dept {
            display: inline-block;
            background: linear-gradient(90deg, #FFEDD5, #FCE7F3);
            color: #EA580C;
            font-size: 0.78rem;
            font-weight: 700;
            padding: 0.3rem 0.85rem;
            border-radius: 999px;
            margin-bottom: 0.5rem;
        }

        h1 {
            font-size: 1.85rem;
            font-weight: 900;
            color: #0F172A;
            margin-bottom: 0.6rem;
        }

        h1 span {
            font-size: 1rem;
            font-weight: 700;
            color: #F97316;
            margin-left: 0.25rem;
        }

        .motto {
            font-size: 0.9rem;
            font-weight: 700;
            color: #475569;
            background: #FFF7ED;
            padding: 0.65rem 1rem;
            border-radius: 16px;
            margin-bottom: 1.35rem;
        }

        /* 技能與興趣精簡標籤 */
        .tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .tag {
            font-size: 0.8rem;
            font-weight: 700;
            padding: 0.4rem 0.8rem;
            border-radius: 999px;
        }

        .t-indigo { background: #EEF2FF; color: #4F46E5; }
        .t-sky    { background: #E0F2FE; color: #0284C7; }
        .t-rose   { background: #FFE4E6; color: #E11D48; }
        .t-amber  { background: #FEF3C7; color: #D97706; }
        .t-green  { background: #D1FAE5; color: #059669; }

        /* 聯繫按鈕列 */
        .links {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            padding: 0.75rem 1.1rem;
            border-radius: 16px;
            font-size: 0.85rem;
            font-weight: 700;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .link-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px -6px rgba(0, 0, 0, 0.12);
        }

        .link-btn span:last-child {
            user-select: all;
        }

        .btn-email { background: #EEF2FF; color: #4338CA; }
        .btn-line  { background: #ECFDF5; color: #047857; }
